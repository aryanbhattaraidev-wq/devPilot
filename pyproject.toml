[project]
name = "dev-pilot"
version = "0.1.0"
description = "AI developer assistant built on the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "openai>=3.39.0",
    "pydantic-settings>=2.16.1",
    "rich>=15.0.0",
    "streamlit>=1.66.1",
]

[project.scripts]
devpilot = "devpilot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devpilot"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
